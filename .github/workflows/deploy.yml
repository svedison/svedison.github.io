# Build the Vite site and publish dist/ to GitHub Pages.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # playwright is only for local visual QA (scripts/shoot.mjs); no browsers needed to build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build (typecheck + vite build)
        run: npm run build
        env:
          # User site (svedison.github.io) is served from the domain root.
          # For a project site (https://<owner>.github.io/<repo>/) use /${{ github.event.repository.name }}/.
          BASE_PATH: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
